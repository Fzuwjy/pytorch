name: Create and publish a Docker image

on:
  release:
    types: [published]
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    name: Push Docker image to Harbor

    steps:
      - name: Clean runner
        run: |
          docker builder prune -f
          docker system prune -a -f
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "/usr/local/share/boost"
          rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Add hosts to /etc/hosts
        env:
          super_secret: ${{ secrets.REGISTRY_HOSTIP }}
        if: ${{ env.super_secret != '' }}
        run: |
          echo "${{ secrets.REGISTRY_HOSTIP }} ${{ secrets.REGISTRY_HOSTNAME }}" | sudo tee -a /etc/hosts
          cat /etc/hosts

      - name: Log in to Harbor
        if: github.event_name == 'release'
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_HOSTNAME }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ secrets.REGISTRY_HOSTNAME }}/${{ secrets.REGISTRY_REPONAME }}/${{ github.event.repository.name }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr

      - name: Push to Harbor
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
